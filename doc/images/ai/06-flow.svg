<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">AI 建表方案模式工作流</title>
  <desc id="desc">输入需求后，方案模式先按需澄清，再输出方案卡；确认后生成完整表单，设计器展示差异并要求应用，建表页展示预览并要求保存。快速生成可跳过澄清与方案。深入思考和方案记录为独立能力。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="660" fill="#ffffff"/>
  <text x="32" y="36" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#0f172a">方案模式工作流（默认）</text>
  <text x="32" y="58" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#64748b">快速生成可跳过澄清与方案；深入思考是独立模型开关，可与任一模式叠加。</text>

  <!-- 输入需求 -->
  <rect x="350" y="84" width="260" height="54" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="480" y="116" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1e293b">输入需求</text>

  <!-- 澄清 -->
  <rect x="330" y="166" width="300" height="66" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="480" y="194" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1e293b">澄清（需要时最多 3 问）</text>
  <text x="480" y="215" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#64748b">带快捷选项；可跳过并按默认假设</text>

  <!-- 方案卡 -->
  <rect x="330" y="260" width="300" height="76" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="480" y="288" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1e293b">方案卡（不生成完整表单）</text>
  <text x="480" y="309" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#64748b">题目大纲 / 变更摘要 / 默认假设 / 风险</text>

  <!-- 确认菱形 -->
  <polygon points="480,364 596,414 480,464 364,414" fill="#fff7ed" stroke="#fdba74"/>
  <text x="480" y="419" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#9a3412">确认？</text>

  <!-- 生成完整表单 -->
  <rect x="340" y="500" width="280" height="60" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="480" y="526" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#065f46">生成完整表单</text>
  <text x="480" y="546" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#047857">按已确认方案的题量、顺序和题型</text>

  <!-- 落地 -->
  <rect x="300" y="596" width="360" height="48" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="480" y="625" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#334155">设计器：差异预览 → 应用　｜　建表页：预览 → 保存</text>

  <!-- 主流程箭头 -->
  <line x1="480" y1="138" x2="480" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="232" x2="480" y2="254" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="336" x2="480" y2="358" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="464" x2="480" y2="494" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="483" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#475569">确认</text>
  <line x1="480" y1="560" x2="480" y2="590" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 调整方案回路 -->
  <path d="M 364 414 H 300 V 298 H 324" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="282" y="360" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#475569">调整方案</text>

  <!-- 快速生成 bypass -->
  <path d="M 350 111 H 70 V 530 H 334" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <rect x="52" y="300" width="96" height="44" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="100" y="318" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#475569">快速生成</text>
  <text x="100" y="334" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#94a3b8">跳过澄清/方案</text>

  <!-- 深入思考 -->
  <rect x="690" y="500" width="240" height="60" rx="9" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="810" y="526" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#6b21a8">深入思考（独立开关）</text>
  <text x="810" y="546" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#7e22ce">模型层，可叠加方案模式或快速生成</text>
  <line x1="690" y1="530" x2="626" y2="530" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>

  <!-- 方案记录 -->
  <rect x="690" y="260" width="240" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="810" y="286" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#334155">方案记录</text>
  <text x="810" y="306" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#64748b">浏览器本地，最多 20 份</text>
  <line x1="690" y1="290" x2="636" y2="290" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>

  <text x="32" y="648" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#94a3b8">流程示意图，合成数据；实际界面以当前部署为准。</text>
</svg>
