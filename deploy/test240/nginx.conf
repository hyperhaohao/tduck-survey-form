server {
    listen 18000;
    server_name 192.168.1.240;
    allow 192.168.1.0/24;
    allow 127.0.0.1;
    deny all;
    root /www/wwwroot/ruima-survey-test;
    index index.html;
    client_max_body_size 30m;
    access_log off;
    location = /auth/oidc/callback {
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /tduck-api/ {
        proxy_pass http://127.0.0.1:18001/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~ ^/(demand-api|auth/oidc|user|form|public|mange|system|wx|wxmp|ai|u)(/|$) {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~ ^/(login/(account|wx|qq)|register/(email|phone)|retrieve/password)(/|$) {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
}
